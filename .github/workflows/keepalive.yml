# Chống Supabase project pause.
#
# Free tier pause project sau 1 tuần không hoạt động. Với 20 user dùng hằng ngày
# thì không xảy ra trong tuần làm việc; rủi ro thật là kỳ nghỉ dài (nghỉ Tết
# 7–10 ngày, quay lại thì app đang pause).
#
# LƯU Ý: scheduled workflow của GitHub Actions bị vô hiệu sau ~60 ngày repo không
# có hoạt động. Nếu pilot có thể đứng im lâu, đặt cron ở dịch vụ ngoài
# (cron-job.org) thì chắc hơn.
#
# Biến cần đặt (Settings → Variables): APP_URL
name: Keepalive

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          URL="${{ vars.APP_URL }}"
          test -n "$URL" || { echo "Thiếu variable APP_URL"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/api/health")
          echo "HTTP $code"
          test "$code" = "200"
